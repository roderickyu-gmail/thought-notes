<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approach the Unmatched</title>
  <style>
    :root { --walnut:#54341f; --cedar:#8a5834; --paper:#fff8ed; --ink:#2b2119; --muted:#7a6351; --line:rgba(84,52,31,.22); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:repeating-linear-gradient(90deg,#5d371f 0,#724728 46px,#8b5a36 92px,#654027 138px); font-family:"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif; }
    .page { width:min(820px,calc(100% - 32px)); margin:auto; padding:56px 0; }
    article { padding:clamp(24px,6vw,64px); background:linear-gradient(135deg,rgba(255,255,255,.74),rgba(255,247,231,.92)),var(--paper); border:1px solid rgba(255,255,255,.62); border-radius:8px; box-shadow:0 26px 72px rgba(31,18,8,.4); }
    .kicker { margin:0 0 18px; color:var(--cedar); font:700 .78rem Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; color:var(--walnut); font:500 clamp(2.35rem,6vw,4.4rem)/1.04 Georgia,serif; }
    .rule { width:88px; height:3px; margin:34px 0 40px; background:var(--cedar); }
    img { display:block; width:100%; height:auto; border:1px solid var(--line); }
    .caption { margin:14px 0 0; color:var(--muted); font: .9rem Arial,sans-serif; }
    footer { margin-top:40px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font: .86rem Arial,sans-serif; }
    @media(max-width:560px) { .page{width:calc(100% - 20px);padding:20px 0;} article{padding:24px 18px;} }
  </style>
</head>
<body>
  <main class="page">
    <article>
      <p class="kicker">Top Thought</p>
      <h1>Approach the Unmatched</h1>
      <div class="rule"></div>
      <img src="images/approach-the-unmatched.png" alt="中文图文：多去接近你根本配不上的人">
      <p class="caption">Image note from the user-provided screenshot.</p>
      <footer>Original image and Chinese text provided by the user.</footer>
    </article>
  </main>
</body>
</html>
