<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Examine Yourself</title>
  <style>
    :root {
      --walnut: #54341f;
      --cedar: #8a5834;
      --paper: #fff8ed;
      --ink: #2b2119;
      --muted: #7a6351;
      --line: rgba(84, 52, 31, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.05)),
        repeating-linear-gradient(
          90deg,
          #5d371f 0,
          #724728 46px,
          #8b5a36 92px,
          #654027 138px
        );
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif;
    }

    .page {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    article {
      position: relative;
      overflow: hidden;
      padding: clamp(34px, 7vw, 72px);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.74), rgba(255, 247, 231, 0.92)),
        var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 8px;
      box-shadow: 0 26px 72px rgba(31, 18, 8, 0.4);
    }

    article::before {
      content: "";
      position: absolute;
      inset: 18px;
      pointer-events: none;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .kicker {
      margin: 0 0 18px;
      color: var(--cedar);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--walnut);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.35rem, 6vw, 4.4rem);
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: 0;
    }

    .rule {
      width: 88px;
      height: 3px;
      margin: 34px 0 40px;
      background: linear-gradient(90deg, var(--cedar), rgba(138, 88, 52, 0));
    }

    p {
      max-width: 620px;
      margin: 0 0 0.92em;
      font-size: clamp(1.32rem, 2.6vw, 1.82rem);
      line-height: 1.72;
    }

    .lead,
    .closing {
      color: var(--walnut);
      font-weight: 700;
    }

    footer {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.86rem;
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 20px, 820px);
        padding: 20px 0;
      }

      article {
        padding: 34px 24px;
      }

      article::before {
        inset: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <article>
      <p class="kicker">Top Thought</p>
      <h1>Examine Yourself</h1>
      <div class="rule"></div>

      <p class="lead">审视自己。</p>

      <p>你的自我。</p>
      <p>你的恐惧。</p>
      <p>你的借口。</p>
      <p>你的瘾。</p>
      <p>你的不安全感。</p>

      <p>观察你的潜意识如何掌控你的生活。</p>

      <p class="closing">一旦你做到了，你就不再被它控制。</p>

      <footer>Original Chinese note.</footer>
    </article>
  </main>
</body>
</html>
